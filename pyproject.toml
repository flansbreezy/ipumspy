[project]
name = "ipumspy"
version = "0.8.2"
description = "A collection of tools for working with IPUMS data"
readme = "README.md"
authors = [
    { name = "Kevin H. Wilson", email = "kevin_wilson@brown.edu" },
    { name = "Renae Rodgers", email = "rodge103@umn.edu" },
]
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE.txt"]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.3",
    "numpy>=2.0.0",
    "click>=8.1.0",
    "pyarrow>=23.0.0",
    "requests>=2.32.5",
    "PyYAML>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/ipums/ipumspy"
Documentation = "https://ipumspy.readthedocs.io"

[project.scripts]
ipums = "ipumspy.cli:cli"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.4",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "pytest-recording>=0.14.0",
    "vcrpy>=8.3.0",
]
docs = [
    "beautifulsoup4>=4.15.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.9",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=5.1.0",
    "furo>=2025.12.19",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# re-exports for the public API
"__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
markers = [ "slow: Run with --runslow",
            "integration: Run with --runint" ]

[tool.coverage.run]
omit = [
    "*/tests/*",
]
